name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # ubuntu-latest is Ubuntu 26.04, which Playwright 1.59 does not list yet, so `playwright install` refuses the
      # platform. The Ubuntu 24.04 Chromium build runs on 26.04 (the AIW workers use it the same way).
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Browser only: `--with-deps` would apt-install the 24.04 package list on 26.04. The runner image already ships
      # the libraries Chromium needs; the next step fails loudly if one is missing.
      - run: npx playwright install chromium
      - name: Check Chromium's shared libraries
        run: |
          missing=$(find ~/.cache/ms-playwright -type f \( -name chrome -o -name chrome-headless-shell \) -exec ldd {} \; | grep 'not found' | sort -u || true)
          if [ -n "$missing" ]; then echo "Chromium needs: $missing"; exit 1; fi
      # npm audit at level low, minus the temporary dev-only exceptions in audit-exceptions.json (expiring, self-retiring).
      - run: npm run audit
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
